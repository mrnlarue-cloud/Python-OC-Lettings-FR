name: Vérification CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Qualité et tests
    runs-on: ubuntu-latest

    # Valeurs de test sans utilisation de .env
    env:
      DJANGO_SECRET_KEY: fausse_cle_de_test
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      SENTRY_DSN: ""

    steps:
      - name: Récupération du code
        uses: actions/checkout@v6

      - name: Installation de Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Installation des dépendances
        run: python -m pip install -r requirements.txt

      # Conservation de setup.cfg comme référence pour Flake8
      - name: Vérification du code avec Flake8
        run: python -m flake8 --config=setup.cfg . --extend-exclude=.venv

      # Exécute les tests
      - name: Exécution des tests et mesure de la couverture
        run: >
          python -m coverage run
          --source=oc_lettings_site,lettings,profiles
          --omit="*/tests/*,*/test_*.py,*/tests.py"
          -m pytest

      - name: Vérification d'une couverture > à 80 %
        run: python -m coverage report --show-missing --precision=2 --fail-under=80.01

  docker:
    name: Publication Docker Hub
    runs-on: ubuntu-latest

    # Attente réussite des tests avant publication
    needs: tests

    # Publication seulement sur push Master
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Récupération du code
        uses: actions/checkout@v6

      # Connexion avec les ID protégés dans GitHub
      - name: Connexion à Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Préparation des images Docker
      - name: Préparation de Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Construction de l'image et envoi vers Docker Hub
      - name: Construction et publication de l'image Docker
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true

          # Un tag pour retrouver l'image via son numéro de commit et la dernière image publiée
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/oc-lettings:${{ github.sha }}
            ${{ vars.DOCKERHUB_USERNAME }}/oc-lettings:latest
