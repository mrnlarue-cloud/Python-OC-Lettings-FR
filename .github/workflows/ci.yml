name: Vérification CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Qualité et tests
    runs-on: ubuntu-latest

    # Valeurs de test sans utilisation de .env
    env:
      DJANGO_SECRET_KEY: fausse_cle_de_test
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      SENTRY_DSN: ""

    steps:
      - name: Récupération du code
        uses: actions/checkout@v6

      - name: Installation de Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Installation des dépendances
        run: python -m pip install -r requirements.txt

      # Conservation de setup.cfg comme référence pour Flake8
      - name: Vérification du code avec Flake8
        run: python -m flake8 --config=setup.cfg . --extend-exclude=.venv

      # Exécute les tests
      - name: Exécution des tests et mesure de la couverture
        run: >
          python -m coverage run
          --source=oc_lettings_site,lettings,profiles
          --omit="*/tests/*,*/test_*.py,*/tests.py"
          -m pytest

      - name: Vérification d'une couverture > à 80 %
        run: python -m coverage report --show-missing --precision=2 --fail-under=80.01
